name: validar

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Estrutura do marketplace e do plugin
        run: python3 scripts/validar.py

      - name: Version subiu quando o plugin mudou
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          ./scripts/conferir-versao.sh "origin/${{ github.base_ref }}"

      - name: Empacota o .plugin do Cowork
        run: ./scripts/empacotar-plugin.sh

      - uses: actions/upload-artifact@v4
        with:
          name: san-co-plugin
          path: dist/san-co.plugin
          if-no-files-found: error
